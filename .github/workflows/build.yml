name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Android setup (debug keystore + editor settings)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/$f
            echo '' >> ~/.config/godot/$f
            echo '[resource]' >> ~/.config/godot/$f
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/$f
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore = "/root/debug.keystore"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/$f
          done

      - name: Find project and show files
        run: |
          echo "=== all files in repo ==="
          find . -path ./.git -prune -o -type f -print | head -50
          P=$(find . -name project.godot | head -1)
          if [ -z "$P" ]; then echo "NO project.godot FOUND IN REPO"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$P")" >> $GITHUB_ENV

      - name: Ensure export_presets.cfg exists
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f export_presets.cfg ]; then
            echo "export_presets.cfg missing - creating it"
            cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/pigclicker.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.pigclicker.salo"
          package/name="Pig Clicker"
          package/signed=true
          screen/immersive_mode=true
          permissions/vibrate=true
          EOF
          fi
          ls -la

      - name: Import project
        run: |
          cd "$PROJECT_DIR"
          godot --headless --verbose --import || true

      - name: Export APK
        run: |
          cd "$PROJECT_DIR"
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/pigclicker.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pigclicker-apk
          path: "**/build/pigclicker.apk"
          
