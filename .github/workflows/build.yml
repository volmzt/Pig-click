name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          ls -R ~/.local/share/godot/export_templates | head -20

      - name: Android setup (debug keystore + editor settings)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/$f
            echo '' >> ~/.config/godot/$f
            echo '[resource]' >> ~/.config/godot/$f
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/$f
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore = "/root/debug.keystore"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/$f
          done

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/pigclicker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pigclicker-apk
          path: build/pigclicker.apk
